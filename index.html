<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pascal | Clases y Recursos</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="hero">
    <h1>Profesor & Instructor</h1>
    <p>Clases personalizadas, material de estudio y lecciones en video.</p>
    <div class="cta-buttons">
      <a href="#videos" class="btn">Ver Videos</a>
      <a href="#recursos" class="btn btn-secondary">Recursos</a>
    </div>
  </header>

  <main class="container">
    <section id="videos" class="section">
      <h2>Clases y Muestras</h2>
      <div class="video-grid">
        <div class="video-card">
          <div class="video-wrapper">
            <iframe 
              src="https://www.youtube-nocookie.com/embed/dQw4w9WgXcQ" 
              title="Muestra de clase" 
              frameborder="0" 
              allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
              allowfullscreen>
            </iframe>
          </div>
          <p class="video-desc">Lección introductoria: técnica y fundamentos.</p>
        </div>
      </div>
    </section>

    <section id="recursos" class="section">
      <h2>Material de Descarga</h2>
      <ul class="resource-list">
        <li>
          <span>Guía práctica en PDF (Ejercicios)</span>
          <a href="#" class="download-link">Descargar</a>
        </li>
      </ul>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Pascal. Todos los derechos reservados.</p>
  </footer>

</body>
</html>
